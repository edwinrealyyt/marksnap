<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkSnap - Markdown 转精美截图</title>
  <meta name="description" content="将 Markdown 内容一键转换为精美截图，支持代码高亮、表格渲染、多主题切换，方便分享到任何平台。">
  <meta name="google-site-verification" content="ePQDVlWsGP71F5bAJxVu1aV2pGtJ9z2zOXmlTRSNxUM" />


  <!-- Highlight.js Themes (local) -->
  <link rel="stylesheet" href="lib/hljs-github-dark.min.css" id="hljs-theme-dark">
  <link rel="stylesheet" href="lib/hljs-github.min.css" id="hljs-theme-light" disabled>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header id="app-header">
    <div class="header-left">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#logo-grad)"/>
          <path d="M9 22V10h3.5l3 7.5L18.5 10H22v12h-2.5v-7.5l-2.5 6h-2l-2.5-6V22H9z" fill="#fff"/>
          <defs>
            <linearGradient id="logo-grad" x1="2" y1="2" x2="30" y2="30">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>MarkSnap</h1>
        <span class="tagline">Markdown → 精美截图</span>
      </div>
    </div>
    <div class="header-right">
      <button id="btn-copy" class="btn btn-secondary" title="复制图片到剪贴板">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        <span>复制图片</span>
      </button>
      <button id="btn-download" class="btn btn-primary" title="下载为 PNG 图片">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>下载 PNG</span>
      </button>
    </div>
  </header>

  <!-- ===== Settings Bar ===== -->
  <div id="settings-bar">
    <div class="settings-group">
      <label class="settings-label">导出主题</label>
      <div class="theme-selector" id="theme-selector">
        <button class="theme-btn active" data-theme="light" title="亮色">
          <span class="theme-preview theme-preview-light"></span>
          <span>亮色</span>
        </button>
        <button class="theme-btn" data-theme="dark" title="暗色">
          <span class="theme-preview theme-preview-dark"></span>
          <span>暗色</span>
        </button>
        <button class="theme-btn" data-theme="github" title="GitHub">
          <span class="theme-preview theme-preview-github"></span>
          <span>GitHub</span>
        </button>
        <button class="theme-btn" data-theme="gradient-blue" title="蓝紫渐变">
          <span class="theme-preview theme-preview-gradient-blue"></span>
          <span>蓝紫</span>
        </button>
        <button class="theme-btn" data-theme="gradient-sunset" title="日落渐变">
          <span class="theme-preview theme-preview-gradient-sunset"></span>
          <span>日落</span>
        </button>
        <button class="theme-btn" data-theme="gradient-green" title="翠绿渐变">
          <span class="theme-preview theme-preview-gradient-green"></span>
          <span>翠绿</span>
        </button>
      </div>
    </div>

    <div class="settings-divider"></div>

    <div class="settings-group">
      <label class="settings-label" for="setting-width">宽度</label>
      <div class="settings-control">
        <input type="range" id="setting-width" min="480" max="1200" value="720" step="20">
        <span class="settings-value" id="setting-width-value">720px</span>
      </div>
    </div>

    <div class="settings-group">
      <label class="settings-label" for="setting-padding">内边距</label>
      <div class="settings-control">
        <input type="range" id="setting-padding" min="16" max="80" value="40" step="4">
        <span class="settings-value" id="setting-padding-value">40px</span>
      </div>
    </div>

    <div class="settings-group">
      <label class="settings-label" for="setting-font-size">字号</label>
      <div class="settings-control">
        <input type="range" id="setting-font-size" min="12" max="22" value="15" step="1">
        <span class="settings-value" id="setting-font-size-value">15px</span>
      </div>
    </div>

    <div class="settings-group">
      <label class="settings-label" for="setting-scale">导出倍率</label>
      <select id="setting-scale" class="settings-select">
        <option value="1">1x</option>
        <option value="2" selected>2x (推荐)</option>
        <option value="3">3x</option>
      </select>
    </div>

    <div class="settings-group">
      <label class="settings-label">
        <input type="checkbox" id="setting-watermark" checked>
        水印
      </label>
    </div>
  </div>

  <!-- ===== Main Content ===== -->
  <main id="app-main">
    <!-- Editor Panel -->
    <div id="editor-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          <span>Markdown 编辑器</span>
        </div>
        <div class="panel-actions">
          <button id="btn-paste" class="panel-btn" title="从剪贴板粘贴">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            </svg>
            <span>粘贴</span>
          </button>
          <button id="btn-clear" class="panel-btn" title="清空内容">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
            <span>清空</span>
          </button>
          <button id="btn-load-file" class="panel-btn" title="加载 .md 文件">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>打开文件</span>
          </button>
          <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden>
        </div>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="在这里粘贴或输入 Markdown 内容..."></textarea>
      <div class="editor-stats">
        <span id="char-count">0 字符</span>
        <span id="line-count">0 行</span>
      </div>
    </div>

    <!-- Resize Handle -->
    <div id="resize-handle" title="拖动调整面板大小">
      <div class="handle-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Preview Panel -->
    <div id="preview-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span>预览 & 导出</span>
        </div>
        <div class="panel-actions">
          <span class="preview-hint">下方区域即为导出内容</span>
        </div>
      </div>
      <div id="preview-scroll">
        <!-- This outer wrapper provides the background / padding for gradient themes -->
        <div id="capture-wrapper">
          <!-- This inner card holds the rendered markdown -->
          <div id="capture-content" class="markdown-body">
            <!-- Rendered markdown goes here -->
          </div>
          <div id="watermark" class="watermark">MarkSnap</div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- ===== Loading Overlay ===== -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p>正在生成图片...</p>
  </div>

  <!-- Dependencies (local files for reliability) -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>


  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
